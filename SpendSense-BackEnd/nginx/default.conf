server {
    listen 80;
    server_name api-spendcents.surenk.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://api-spendcents.surenk.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-spendcents.surenk.dev;

    ssl_certificate /etc/letsencrypt/live/api-spendcents.surenk.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-spendcents.surenk.dev/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $backend app:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
